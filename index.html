<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KIGO CHAT V1.0 — Connect Freely. Chat Your Way.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #081120; --surface: #101B30; --surface-2: #16243D; --border: #263B59;
    --text: #ECF3FC; --muted: #9FB0C7; --accent: #00E5FF; --on-accent: #04101C;
    --bubble: #0097A7; --danger: #EF4444; --online: #22C55E; --radius: 18px;
    --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace; --font-size: 14px;
  }
  body.theme-light { --bg:#F5F8FC;--surface:#FFFFFF;--surface-2:#E9EFF8;--border:#CBD5E1;--text:#0F172A;--muted:#475569;--on-accent:#FFFFFF; }
  body.theme-amoled { --bg:#000;--surface:#090E18;--surface-2:#121826;--border:#233044;--text:#F4F7FB;--muted:#9FB0C7; }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:var(--font-size);display:flex;flex-direction:column;overflow:hidden}
  button,input,textarea,select{font-family:inherit;font-size:inherit}
  .btn{border:0;border-radius:14px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease,opacity .15s ease}
  .btn:active{transform:scale(.98)} .btn-primary{background:var(--accent);color:var(--on-accent)}
  .btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
  .btn-danger{background:var(--danger);color:#fff}.btn-ghost{background:transparent;color:var(--muted);padding:8px 10px}
  .btn-sm{padding:6px 12px;font-size:12px;border-radius:10px}.input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);outline:none}
  .input:focus{border-color:var(--accent)}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
  .chip{display:inline-flex;gap:6px;padding:4px 10px;border-radius:8px;font-size:12px;font-family:var(--font-mono);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
  .avatar{width:44px;height:44px;border-radius:999px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 35%,transparent),#7C4DFF55);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);display:inline-flex;align-items:center;justify-content:center;font-weight:700;position:relative;overflow:hidden;flex-shrink:0}
  .avatar img{width:100%;height:100%;object-fit:cover}.online-dot{width:11px;height:11px;border-radius:999px;background:var(--online);border:2px solid var(--surface);position:absolute;right:0;bottom:0}
  .app-shell{display:flex;flex:1;min-height:0}.rail{width:84px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 8px;gap:10px}
  .rail-btn{width:64px;padding:10px 4px;border-radius:14px;background:transparent;color:var(--muted);border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
  .rail-btn.active{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-weight:700}
  .main-pane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}.topbar{padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .scroll-area{flex:1;overflow-y:auto;padding:18px}.stack{display:flex;flex-direction:column;gap:12px;max-width:920px;margin:0 auto}
  .row{display:flex;align-items:center;gap:10px}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .chat-wrap{flex:1;display:flex;flex-direction:column;min-height:0}.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
  .wallpaper-aurora{background:radial-gradient(circle at 15% 15%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 45%),radial-gradient(circle at 85% 80%,rgba(124,77,255,.14),transparent 45%),var(--bg)}
  .wallpaper-grid{background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:28px 28px;background-color:var(--bg)}
  .msg-bubble{max-width:min(76%,540px);padding:10px 14px;border-radius:18px;border:1px solid var(--border);background:var(--surface-2);word-break:break-word}
  .msg-bubble.mine{align-self:flex-end;background:var(--bubble);color:#fff;border-color:transparent}.msg-bubble.theirs{align-self:flex-start}
  .composer{padding:10px 14px;background:var(--surface);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
  .floating-nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 14px;display:none;gap:8px;z-index:40}
  .bottom-nav-docked{display:none;background:var(--surface);border-top:1px solid var(--border);justify-content:space-around;padding:6px 4px}
  .toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:var(--surface-2);color:var(--text);border:1px solid var(--accent);padding:10px 16px;border-radius:12px;z-index:90}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:80}
  .modal{max-width:520px;width:100%;max-height:90vh;overflow-y:auto}
  @media(max-width:720px){.rail{display:none}body.nav-docked .bottom-nav-docked{display:flex}body.nav-floating .floating-nav{display:flex}}
</style>
</head>
<body class="nav-docked">
<div id="root" class="app-shell"></div><div id="toast" class="toast" style="display:none"></div><div id="modalRoot"></div>
<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
import {getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendEmailVerification,sendPasswordResetEmail,reload,signOut,deleteUser} from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
import {getFirestore,doc,collection,query,where,orderBy,limit,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,runTransaction,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";
const DEFAULT_FIREBASE_CONFIG={projectId:"gen-lang-client-0870993560",authDomain:"gen-lang-client-0870993560.firebaseapp.com",storageBucket:"gen-lang-client-0870993560.firebasestorage.app",messagingSenderId:"502003328353",apiKey:"",appId:""};
const FIRESTORE_DATABASE_ID="ai-studio-android-kigochat-aa390241-e7c4-4171-8338-1082dd015050";
function loadFirebaseConfig(){try{const saved=JSON.parse(localStorage.getItem("kigo_web_firebase_config")||"null");return saved&&saved.apiKey?{...DEFAULT_FIREBASE_CONFIG,...saved}:DEFAULT_FIREBASE_CONFIG}catch{return DEFAULT_FIREBASE_CONFIG}}
let firebaseApp=null,auth=null,db=null;
function initFirebase(){const cfg=loadFirebaseConfig();if(!cfg.apiKey||!cfg.appId)return false;try{firebaseApp=getApps().length?getApps()[0]:initializeApp(cfg);auth=getAuth(firebaseApp);db=getFirestore(firebaseApp,FIRESTORE_DATABASE_ID);return true}catch(e){console.error("Firebase init failed:",e);return false}}
/* Auth UI deliberately keeps existing login flow but surfaces missing project settings instead of sending an empty API key. */
async function kigoGoogleSignIn(){if(!initFirebase()){showToast("Firebase is not configured for this web app. Add the Web App config in Settings.");return}try{const p=new GoogleAuthProvider();await signInWithPopup(auth,p)}catch(e){showToast("Google sign-in failed: "+(e.code||e.message))}}
async function kigoEmailSignIn(email,password){if(!initFirebase()){showToast("Firebase is not configured for this web app. Add the Web App config in Settings.");return}try{await signInWithEmailAndPassword(auth,email,password)}catch(e){showToast("Email login failed: "+(e.code||e.message))}}
async function kigoRegister(email,password){if(!initFirebase()){showToast("Firebase is not configured for this web app. Add the Web App config in Settings.");return}try{const c=await createUserWithEmailAndPassword(auth,email,password);await sendEmailVerification(c.user);showToast("Account created. Please verify your email.")}catch(e){showToast("Registration failed: "+(e.code||e.message))}}
async function kigoForgotPassword(email){if(!initFirebase()){showToast("Firebase is not configured for this web app. Add the Web App config in Settings.");return}try{await sendPasswordResetEmail(auth,email);showToast("Password reset email sent.")}catch(e){showToast("Password reset failed: "+(e.code||e.message))}}
window.kigoGoogleSignIn=kigoGoogleSignIn;window.kigoEmailSignIn=kigoEmailSignIn;window.kigoRegister=kigoRegister;window.kigoForgotPassword=kigoForgotPassword;
window.kigoSetFirebaseConfig=(config)=>{try{localStorage.setItem("kigo_web_firebase_config",JSON.stringify(config));location.reload()}catch(e){showToast("Could not save Firebase settings.")}};
window.kigoFirebaseStatus=()=>({configured:!!auth,projectId:firebaseApp?.options?.projectId||null,user:auth?.currentUser?.email||null});
function showToast(message){const t=document.getElementById("toast");if(!t)return;t.textContent=message;t.style.display="block";clearTimeout(window.__kigoToastTimer);window.__kigoToastTimer=setTimeout(()=>t.style.display="none",4200)}
initFirebase();
</script>
</body></html>
