<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";

// ============================================================
// BACKEND CONFIGURATION (Firebase Project + Named Firestore DB)
// ============================================================
const DEFAULT_FIREBASE_CONFIG = {
  // This matches the supplied Android Firebase project, not the old AI Studio project.
  projectId: "kigo-chat-256bf",
  authDomain: "kigo-chat-256bf.firebaseapp.com",
  storageBucket: "kigo-chat-256bf.firebasestorage.app",
  messagingSenderId: "1089852434084",
  apiKey: "AIzaSyAVCBnRbnDYSVWdoGNMmYJQFtrnls0xUps",
  // The supplied google-services.json registers Android only; no Web appId was supplied.
  appId: ""
};
const FIRESTORE_DATABASE_ID = "ai-studio-android-kigochat-aa390241-e7c4-4171-8338-1082dd015050";

function loadFirebaseConfig() {
  // Ignore stale browser settings from a different Firebase project. Those caused
  // the auth/api-key-not-valid error when the site used the old gen-lang project.
  try {
    const saved = JSON.parse(localStorage.getItem("kigo_web_firebase_config") || "null");
    if (saved && saved.projectId === DEFAULT_FIREBASE_CONFIG.projectId &&
        saved.apiKey === DEFAULT_FIREBASE_CONFIG.apiKey) {
      return { ...DEFAULT_FIREBASE_CONFIG, ...saved };
    }
    localStorage.removeItem("kigo_web_firebase_config");
  } catch {
    localStorage.removeItem("kigo_web_firebase_config");
  }
  return DEFAULT_FIREBASE_CONFIG;
}

let firebaseApp = null;
let auth = null;
let db = null;

function initFirebase() {
  const cfg = loadFirebaseConfig();
  if (!cfg.apiKey || !cfg.projectId) return false;
  try {
    firebaseApp = getApps().find(app => app.name === "[DEFAULT]") || initializeApp(cfg);
    auth = getAuth(firebaseApp);
    db = getFirestore(firebaseApp, FIRESTORE_DATABASE_ID);
    return true;
  } catch (e) {
    console.error("Firebase init failed:", e);
    return false;
  }
}

// ============================================================
// E2EE CRYPTO ENGINE (Web Crypto ECDH P-256 + HKDF + AES-GCM)
// ============================================================
const KigoCrypto = {
  _b64(buf) {
    const bytes = new Uint8Array(buf);
    let bin = "";
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  },
  _unb64(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  },
  async getOrCreateKeyPair(uid) {
    const pubKeyStr = localStorage.getItem("kigo_ecdh_pub_" + uid);
    const privKeyStr = localStorage.getItem("kigo_ecdh_priv_" + uid);
    if (pubKeyStr && privKeyStr) {
      const publicKey = await crypto.subtle.importKey("spki", this._unb64(pubKeyStr), { name: "ECDH", namedCurve: "P-256" }, true, []);
      const privateKey = await crypto.subtle.importKey("pkcs8", this._unb64(privKeyStr), { name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
      return { publicKey, privateKey, publicKeyBase64: pubKeyStr };
    }
    const kp = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
    const spki = this._b64(await crypto.subtle.exportKey("spki", kp.publicKey));
    const pkcs8 = this._b64(await crypto.subtle.exportKey("pkcs8", kp.privateKey));
    localStorage.setItem("kigo_ecdh_pub_" + uid, spki);
    localStorage.setItem("kigo_ecdh_priv_" + uid, pkcs8);
    return { publicKey: kp.publicKey, privateKey: kp.privateKey, publicKeyBase64: spki };
  },
  async deriveAesKey(myPrivKey, peerPubB64, convId) {
    const peerPub = await crypto.subtle.importKey("spki", this._unb64(peerPubB64), { name: "ECDH", namedCurve: "P-256" }, false, []);
    const sharedBits = await crypto.subtle.deriveBits({ name: "ECDH", public: peerPub }, myPrivKey, 256);
    const hkdfKey = await crypto.subtle.importKey("raw", sharedBits, "HKDF", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      {
        name: "HKDF",
        hash: "SHA-256",
        salt: new TextEncoder().encode("KIGO-CHAT-E2EE-V1"),
        info: new TextEncoder().encode("kigo-msg:" + convId)
      },
      hkdfKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );
  },
  async encrypt(uid, peerPubB64, convId, plaintext) {
    const kp = await this.getOrCreateKeyPair(uid);
    const aes = await this.deriveAesKey(kp.privateKey, peerPubB64, convId);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const cipher = await crypto.subtle.encrypt(
      { name: "AES-GCM", iv, additionalData: new TextEncoder().encode(convId) },
      aes,
      new TextEncoder().encode(plaintext)
    );
    return { ciphertextBase64: this._b64(cipher), ivBase64: this._b64(iv) };
  },
  async decrypt(uid, peerPubB64, convId, cipherB64, ivB64) {
    try {
      const kp = await this.getOrCreateKeyPair(uid);
      const aes = await this.deriveAesKey(kp.privateKey, peerPubB64, convId);
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: this._unb64(ivB64), additionalData: new TextEncoder().encode(convId) },
        aes,
        this._unb64(cipherB64)
      );
      return new TextDecoder().decode(plain);
    } catch { return null; }
  },
  async fingerprint(pubB64) {
    if (!pubB64) return "Not initialized";
    const hash = await crypto.subtle.digest("SHA-256", this._unb64(pubB64));
    return Array.from(new Uint8Array(hash).slice(0, 16))
      .map(b => b.toString(16).padStart(2, "0").toUpperCase())
      .join(" ").replace(/(.{4}) /g, "$1 ");
  }
};

// ============================================================
// GLOBAL REACTIVE STORE
// ============================================================
const DEFAULT_SETTINGS = {
  themeMode: "dark",
  accentPreset: "cyan",
  bubbleColorHex: "#0097A7",
  fontStyle: "jakarta",
  fontScale: "standard",
  messageLayout: "modern",
  navigationStyle: "docked",
  profileTheme: "aurora",
  chatWallpaper: "aurora",
  notificationSound: "pulse",
  notifyMessages: true,
  notifyFriendRequests: true,
  notifyGroups: true,
  notifyMentions: true
};

const state = {
  firebaseReady: initFirebase(),
  checkingSession: true,
  user: null,
  profile: null,
  profileLoaded: false,
  screen: "welcome",
  activeConversationId: null,
  settings: { ...DEFAULT_SETTINGS },
  conversations: [],
  messages: [],
  friendships: [],
  friendRequests: [],
  groups: [],
  notifications: [],
  blockedUsers: [],
  peerProfiles: {},
  searchResults: [],
  mediaGallery: [],
  chatFilter: "all",
  mediaFilter: "all",
  replyTo: null,
  editingMsg: null,
  msgSearch: "",
  decryptedCache: {},
  unsubs: [],
  msgUnsub: null,
  voiceRecorder: null,
  voiceChunks: [],
  voiceRecording: false,
  voiceSeconds: 0,
  voiceTimer: null,
  recordedVoiceB64: null
};

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.style.display = "none"; }, 3200);
}

function applyTheme(s) {
  document.body.classList.remove("theme-light", "theme-amoled", "nav-docked", "nav-floating");
  if (s.themeMode === "light") document.body.classList.add("theme-light");
  if (s.themeMode === "amoled") document.body.classList.add("theme-amoled");
  document.body.classList.add(s.navigationStyle === "floating" ? "nav-floating" : "nav-docked");

  const accents = {
    cyan: s.themeMode === "light" ? "#0097A7" : "#00E5FF",
    violet: s.themeMode === "light" ? "#7C4DFF" : "#B388FF",
    emerald: s.themeMode === "light" ? "#00A152" : "#00E676",
    amber: "#FFB300",
    rose: "#FF4081"
  };
  const fonts = {
    jakarta: "'Plus Jakarta Sans', system-ui, sans-serif",
    grotesk: "'Space Grotesk', system-ui, sans-serif",
    mono: "'JetBrains Mono', monospace",
    serif: "Georgia, serif"
  };
  const scales = { compact: "13px", standard: "14px", large: "16px", xl: "18px" };
  const rootStyle = document.documentElement.style;
  rootStyle.setProperty("--accent", accents[s.accentPreset] || accents.cyan);
  rootStyle.setProperty("--bubble", s.bubbleColorHex || "#0097A7");
  rootStyle.setProperty("--font-body", fonts[s.fontStyle] || fonts.jakarta);
  rootStyle.setProperty("--font-size", scales[s.fontScale] || "14px");
}

function clearSubscriptions() {
  state.unsubs.forEach(fn => fn && fn());
  state.unsubs = [];
  if (state.msgUnsub) { state.msgUnsub(); state.msgUnsub = null; }
}

async function fetchPeer(uid) {
  if (!uid || uid === state.user?.uid || state.peerProfiles[uid]) return state.peerProfiles[uid];
  try {
    const snap = await getDoc(doc(db, "users", uid));
    if (snap.exists()) {
      state.peerProfiles[uid] = { id: snap.id, ...snap.data() };
      return state.peerProfiles[uid];
    }
  } catch {}
  return null;
}

function attachUserStreams(uid) {
  clearSubscriptions();
  state.unsubs.push(
    onSnapshot(doc(db, "users", uid), (snap) => {
      state.profile = snap.exists() ? { id: snap.id, ...snap.data() } : null;
      state.profileLoaded = true;
      if (state.profile && ["welcome", "login", "register", "verify", "create_profile"].includes(state.screen)) {
        state.screen = "home";
      }
      render();
    }),
    onSnapshot(doc(db, "userSettings", uid), (snap) => {
      state.settings = snap.exists() ? { ...DEFAULT_SETTINGS, ...snap.data() } : { ...DEFAULT_SETTINGS };
      applyTheme(state.settings);
      render();
    }),
    onSnapshot(query(collection(db, "conversations"), where("participantIds", "array-contains", uid)), async (snap) => {
      state.conversations = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (b.lastMessageAt?.seconds || 0) - (a.lastMessageAt?.seconds || 0));
      for (const c of state.conversations) {
        for (const p of (c.participantIds || [])) await fetchPeer(p);
      }
      render();
    }),
    onSnapshot(query(collection(db, "friendships"), where("participantIds", "array-contains", uid)), async (snap) => {
      state.friendships = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      for (const f of state.friendships) {
        await fetchPeer(f.userAId === uid ? f.userBId : f.userAId);
      }
      render();
    }),
    onSnapshot(query(collection(db, "friendRequests"), where("participantIds", "array-contains", uid)), (snap) => {
      state.friendRequests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }),
    onSnapshot(query(collection(db, "groups"), where("memberIds", "array-contains", uid)), (snap) => {
      state.groups = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }),
    onSnapshot(query(collection(db, "notifications"), where("recipientId", "==", uid)), (snap) => {
      state.notifications = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      render();
    }),
    onSnapshot(query(collection(db, "blockedUsers"), where("userId", "==", uid)), (snap) => {
      state.blockedUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    })
  );
}

// ============================================================
// BACKEND OPERATIONS (Firestore + Auth + E2EE)
// ============================================================
async function createProfileWithKigoId(username, displayName, about) {
  const uid = auth.currentUser.uid;
  const cleanUser = username.trim().toLowerCase().replace(/[^a-z0-9_.]/g, "");
  if (cleanUser.length < 3) return toast("Username must be at least 3 characters.");
  const kp = await KigoCrypto.getOrCreateKeyPair(uid);

  for (let i = 0; i < 6; i++) {
    const num = Math.floor(100000 + Math.random() * 900000);
    const kigoId = `KIGO-${num}`;
    try {
      await runTransaction(db, async (tx) => {
        const userRef = doc(db, "users", uid);
        const kigoRef = doc(db, "kigoIds", kigoId);
        const unameRef = doc(db, "usernames", cleanUser);
        const privRef = doc(db, "users", uid, "private", "account");

        const [uSnap, kSnap, nSnap] = await Promise.all([tx.get(userRef), tx.get(kigoRef), tx.get(unameRef)]);
        if (uSnap.exists()) throw new Error("Profile already exists.");
        if (kSnap.exists()) throw new Error("RETRY_ID");
        if (nSnap.exists() && nSnap.data().userId !== uid) throw new Error("Username already taken.");

        tx.set(userRef, {
          userId: uid, kigoId, username: cleanUser, displayName: displayName.trim().slice(0, 60),
          about: about.trim().slice(0, 300), customStatus: "", photoUrl: "",
          online: true, lastSeen: serverTimestamp(), publicKeyBase64: kp.publicKeyBase64,
          showOnlineStatus: true, showLastSeen: true, showReadReceipts: true,
          allowFriendRequests: true, allowDiscovery: true,
          createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        });
        tx.set(privRef, {
          userId: uid, email: auth.currentUser.email || "", accountStatus: "active", createdAt: serverTimestamp()
        });
        tx.set(kigoRef, {
          userId: uid, kigoId, username: cleanUser, displayName: displayName.trim(), photoUrl: "",
          createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        });
        tx.set(unameRef, {
          userId: uid, username: cleanUser, displayName: displayName.trim(), kigoId, photoUrl: "",
          allowDiscovery: true, createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        });
      });
      toast("Assigned permanent ID: " + kigoId);
      return;
    } catch (e) {
      if (e.message !== "RETRY_ID") return toast(e.message || "Profile creation failed");
    }
  }
}

async function searchUsers(qStr) {
  const q = qStr.trim();
  if (!q) return;
  const results = [];
  if (q.toUpperCase().startsWith("KIGO-")) {
    const snap = await getDoc(doc(db, "kigoIds", q.toUpperCase()));
    if (snap.exists() && snap.data().userId !== state.user.uid) {
      const p = await fetchPeer(snap.data().userId);
      if (p) results.push(p);
    }
  } else {
    const clean = q.replace(/^@/, "").toLowerCase();
    const snap = await getDoc(doc(db, "usernames", clean));
    if (snap.exists() && snap.data().allowDiscovery && snap.data().userId !== state.user.uid) {
      const p = await fetchPeer(snap.data().userId);
      if (p) results.push(p);
    }
  }
  state.searchResults = results;
  if (!results.length) toast("No matching user found.");
  render();
}

async function openDirectChat(partnerId) {
  const uid = state.user.uid;
  const partner = await fetchPeer(partnerId);
  if (!partner) return toast("Could not load user profile.");
  const sorted = [uid, partnerId].sort();
  const convId = `dm_${sorted[0]}_${sorted[1]}`;
  const ref = doc(db, "conversations", convId);
  const existing = await getDoc(ref);
  if (!existing.exists()) {
    await setDoc(ref, {
      type: "direct", title: partner.displayName, photoUrl: partner.photoUrl || "",
      participantIds: sorted, adminIds: sorted, createdBy: uid,
      lastMessagePreview: "End-to-end encrypted chat ready", lastMessageType: "system",
      lastMessageSenderId: uid, lastMessageAt: serverTimestamp(),
      unreadCounts: { [sorted[0]]: 0, [sorted[1]]: 0 },
      archivedBy: [], typingUsers: {}, isEncrypted: true,
      createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    });
  }
  openConversation(convId);
}

function openConversation(convId) {
  state.activeConversationId = convId;
  state.screen = "conversation";
  state.replyTo = null;
  state.editingMsg = null;
  if (state.msgUnsub) state.msgUnsub();
  const qMsgs = query(
    collection(db, "conversations", convId, "messages"),
    where("participantIds", "array-contains", state.user.uid),
    orderBy("createdAt", "desc"),
    limit(50)
  );
  state.msgUnsub = onSnapshot(qMsgs, async (snap) => {
    state.messages = snap.docs.map(d => ({ id: d.id, ...d.data() })).reverse();
    const conv = state.conversations.find(c => c.id === convId);
    const peerId = conv?.type === "direct" ? conv.participantIds.find(p => p !== state.user.uid) : null;
    const peerKey = peerId ? (await fetchPeer(peerId))?.publicKeyBase64 : null;
    for (const m of state.messages) {
      if (m.isEncrypted && m.ciphertext && peerKey && !state.decryptedCache[m.id]) {
        const plain = await KigoCrypto.decrypt(state.user.uid, peerKey, convId, m.ciphertext, m.ivBase64);
        if (plain !== null) state.decryptedCache[m.id] = plain;
      }
    }
    render();
  });
  render();
}

async function sendMessage(type, plainText, extra = {}) {
  const conv = state.conversations.find(c => c.id === state.activeConversationId);
  if (!conv) return;
  const uid = state.user.uid;
  const peerId = conv.type === "direct" ? conv.participantIds.find(p => p !== uid) : null;
  const peer = peerId ? await fetchPeer(peerId) : null;

  if (state.editingMsg && type === "text") {
    const mRef = doc(db, "conversations", conv.id, "messages", state.editingMsg.id);
    if (state.editingMsg.isEncrypted && peer?.publicKeyBase64) {
      const enc = await KigoCrypto.encrypt(uid, peer.publicKeyBase64, conv.id, plainText);
      await updateDoc(mRef, { ciphertext: enc.ciphertextBase64, ivBase64: enc.ivBase64, edited: true, updatedAt: serverTimestamp() });
    } else {
      await updateDoc(mRef, { text: plainText, edited: true, updatedAt: serverTimestamp() });
    }
    state.editingMsg = null;
    render();
    return;
  }

  let payload = {
    conversationId: conv.id, senderId: uid, senderName: state.profile.displayName,
    participantIds: conv.participantIds, type, edited: false, deleted: false,
    readBy: [uid], deliveredTo: [uid], reactions: {},
    createdAt: serverTimestamp(), updatedAt: serverTimestamp(), ...extra
  };
  if (state.replyTo) {
    payload.replyToMessageId = state.replyTo.id;
    payload.replyToPreview = (state.decryptedCache[state.replyTo.id] || state.replyTo.text || state.replyTo.type).slice(0, 120);
  }
  if (conv.type === "direct" && type === "text" && peer?.publicKeyBase64) {
    const enc = await KigoCrypto.encrypt(uid, peer.publicKeyBase64, conv.id, plainText);
    payload.ciphertext = enc.ciphertextBase64;
    payload.ivBase64 = enc.ivBase64;
    payload.isEncrypted = true;
  } else {
    payload.text = plainText;
    payload.isEncrypted = false;
  }

  const msgRef = doc(collection(db, "conversations", conv.id, "messages"));
  const convRef = doc(db, "conversations", conv.id);
  const preview = payload.isEncrypted ? "Encrypted message" : (plainText || `${type} attachment`).slice(0, 120);
  const unreadCounts = { ...(conv.unreadCounts || {}) };
  conv.participantIds.forEach(p => { if (p !== uid) unreadCounts[p] = (unreadCounts[p] || 0) + 1; });

  const batch = writeBatch(db);
  batch.set(msgRef, payload);
  batch.update(convRef, {
    lastMessagePreview: preview, lastMessageType: type, lastMessageSenderId: uid,
    lastMessageAt: serverTimestamp(), unreadCounts, updatedAt: serverTimestamp()
  });
  await batch.commit();
  state.replyTo = null;
  render();
}

window.sendFriendReq = async (toUid) => {
  const peer = state.peerProfiles[toUid];
  const sorted = [state.user.uid, toUid].sort();
  const id = `req_${sorted[0]}_${sorted[1]}`;
  await setDoc(doc(db, "friendRequests", id), {
    fromUserId: state.user.uid, toUserId: toUid,
    fromDisplayName: state.profile.displayName, fromKigoId: state.profile.kigoId, fromPhotoUrl: "",
    toDisplayName: peer.displayName, toKigoId: peer.kigoId,
    participantIds: sorted, status: "pending", createdAt: serverTimestamp(), updatedAt: serverTimestamp()
  });
  toast("Friend request sent!");
};
window.acceptReq = async (reqId) => {
  const r = state.friendRequests.find(x => x.id === reqId);
  if (!r) return;
  const sorted = [r.fromUserId, r.toUserId].sort();
  await setDoc(doc(db, "friendships", `fs_${sorted[0]}_${sorted[1]}`), {
    participantIds: sorted, userAId: r.fromUserId, userADisplayName: r.fromDisplayName, userAKigoId: r.fromKigoId,
    userBId: r.toUserId, userBDisplayName: state.profile.displayName, userBKigoId: state.profile.kigoId, createdAt: serverTimestamp()
  });
  await updateDoc(doc(db, "friendRequests", reqId), { status: "accepted", updatedAt: serverTimestamp() });
  toast("Friend added!");
};
window.rejectReq = (id) => updateDoc(doc(db, "friendRequests", id), { status: "rejected", updatedAt: serverTimestamp() });
window.cancelReq = (id) => deleteDoc(doc(db, "friendRequests", id));
window.removeFriend = (id) => deleteDoc(doc(db, "friendships", id));
window.blockPeer = (uid, name, kigo) => setDoc(doc(db, "blockedUsers", `${state.user.uid}_${uid}`), {

});
window.unblockPeer = (uid) => deleteDoc(doc(db, "blockedUsers", `${state.user.uid}_${uid}`));
window.startDirectChat = openDirectChat;
window.openConv = openConversation;

window.setMediaFilter = (f) => { state.mediaFilter = f; render(); };

window.toggleArchive = async (cid) => {
  const c = state.conversations.find(x => x.id === cid);
  const arch = c.archivedBy || [];
  const next = arch.includes(state.user.uid) ? arch.filter(x => x !== state.user.uid) : [...arch, state.user.uid];
  await updateDoc(doc(db, "conversations", cid), { archivedBy: next, updatedAt: serverTimestamp() });
};
window.sendTextMsg = () => {
  const inp = document.getElementById("msgInput");
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = "";
  sendMessage("text", txt);
};
window.replyMsg = (id) => { state.replyTo = state.messages.find(m => m.id === id); state.editingMsg = null; render(); };
window.editMsg = (id) => {
  const m = state.messages.find(x => x.id === id);
  state.editingMsg = m; state.replyTo = null; render();
  const inp = document.getElementById("msgInput");
  if (inp) inp.value = state.decryptedCache[id] || m.text || "";
};
window.clearReplyEdit = () => { state.replyTo = null; state.editingMsg = null; render(); };
window.delMsg = (id) => updateDoc(doc(db, "conversations", state.activeConversationId, "messages", id), { deleted: true, text: "", ciphertext: "", updatedAt: serverTimestamp() });
window.reactMsg = async (id, emoji) => {
  const m = state.messages.find(x => x.id === id);
  const r = { ...(m.reactions || {}) };
  if (r[state.user.uid] === emoji) delete r[state.user.uid]; else r[state.user.uid] = emoji;
  await updateDoc(doc(db, "conversations", state.activeConversationId, "messages", id), { reactions: r, updatedAt: serverTimestamp() });
};
window.handleFileAttach = (input) => {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 420 * 1024) return toast("File exceeds 420 KB inline sync limit.");
  const reader = new FileReader();
  reader.onload = () => {
    const b64 = String(reader.result).split(",")[1];
    const type = file.type.startsWith("image/") ? "image" : (file.type.startsWith("video/") ? "video" : "document");
    sendMessage(type, "", { mediaDataBase64: b64, mediaName: file.name, mediaMimeType: file.type, mediaSizeBytes: file.size });
  };
  reader.readAsDataURL(file);
};
window.shareLocationWithConsent = () => {
  if (!confirm("Share your current GPS coordinates with this chat?")) return;
  navigator.geolocation.getCurrentPosition(
    pos => sendMessage("location", "Shared my location", { locationLat: pos.coords.latitude, locationLng: pos.coords.longitude }),
    err => toast("Location error: " + err.message)
  );
};
window.createNewGroup = async () => {
  const name = document.getElementById("grpName").value.trim();
  const description = document.getElementById("grpDesc").value.trim();
  if (!name) return toast("Enter a group name.");
  const grpRef = doc(collection(db, "groups"));
  const convRef = doc(collection(db, "conversations"));
  const uid = state.user.uid;
  const batch = writeBatch(db);
  batch.set(convRef, {
    type: "group", title: name, description, participantIds: [uid], adminIds: [uid], createdBy: uid,
    lastMessagePreview: "Group created", lastMessageType: "system", lastMessageSenderId: uid,
    lastMessageAt: serverTimestamp(), unreadCounts: { [uid]: 0 }, archivedBy: [], typingUsers: {}, isEncrypted: false,
    createdAt: serverTimestamp(), updatedAt: serverTimestamp()
  });
  batch.set(grpRef, {
    name, description, conversationId: convRef.id, createdBy: uid, adminIds: [uid], memberIds: [uid],
    isPrivate: false, requireAdminApproval: false, createdAt: serverTimestamp(), updatedAt: serverTimestamp()
  });
  await batch.commit();
  openConversation(convRef.id);
};
window.leaveGroup = async (gid, cid) => {
  const g = state.groups.find(x => x.id === gid);
  const nextMembers = (g.memberIds || []).filter(m => m !== state.user.uid);
  await updateDoc(doc(db, "groups", gid), { memberIds: nextMembers, updatedAt: serverTimestamp() });
  await updateDoc(doc(db, "conversations", cid), { participantIds: nextMembers, updatedAt: serverTimestamp() });
  toast("Left group");
};
window.loadMediaGallery = async () => {
  const collected = [];
  for (const c of state.conversations.slice(0, 12)) {
    const snap = await getDocs(query(collection(db, "conversations", c.id, "messages"), where("participantIds", "array-contains", state.user.uid), limit(25)));
    snap.docs.forEach(d => {
      const m = { id: d.id, ...d.data() };
      if (!m.deleted && ["image","video","document","voice"].includes(m.type)) collected.push(m);
    });
  }
  state.mediaGallery = collected;
  render();
};
window.toggleVoiceRecord = async () => {
  if (state.voiceRecording) {
    state.voiceRecorder.stop();
    clearInterval(state.voiceTimer);
    state.voiceRecording = false;
    render();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    state.voiceChunks = [];
    state.voiceSeconds = 0;
    state.voiceRecorder = new MediaRecorder(stream);
    state.voiceRecorder.ondataavailable = e => state.voiceChunks.push(e.data);
    state.voiceRecorder.onstop = () => {
      const blob = new Blob(state.voiceChunks, { type: "audio/webm" });
      const reader = new FileReader();
      reader.onload = () => { state.recordedVoiceB64 = String(reader.result).split(",")[1]; render(); };
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(t => t.stop());
    };
    state.voiceRecorder.start();
    state.voiceRecording = true;
    state.voiceTimer = setInterval(() => { state.voiceSeconds++; render(); }, 1000);
    render();
  } catch (e) { toast("Microphone error: " + e.message); }
};
window.sendRecordedVoice = async () => {
  const cid = document.getElementById("voiceTargetConv")?.value;
  if (!cid || !state.recordedVoiceB64) return;
  state.activeConversationId = cid;
  await sendMessage("voice", "", { mediaDataBase64: state.recordedVoiceB64, mediaName: "voice.webm", mediaMimeType: "audio/webm", mediaDurationMs: state.voiceSeconds * 1000 });
  state.recordedVoiceB64 = null;
  toast("Voice clip sent!");
  render();
};
window.updateSetting = async (key, val) => {
  state.settings = { ...state.settings, [key]: val };
  applyTheme(state.settings);
  render();
  await setDoc(doc(db, "userSettings", state.user.uid), { ...state.settings, userId: state.user.uid, updatedAt: serverTimestamp() }, { merge: true });
};
window.openNotif = async (id, type, targetId) => {
  await updateDoc(doc(db, "notifications", id), { read: true });
  if (type === "friend_request") nav("requests");
  else if (targetId) openConversation(targetId);
};
window.saveProfileEdits = async () => {
  await updateDoc(doc(db, "users", state.user.uid), {
    displayName: document.getElementById("profName").value.trim(),
    customStatus: document.getElementById("profStatus").value.trim(),
    about: document.getElementById("profAbout").value.trim(),
    updatedAt: serverTimestamp()
  });
  toast("Profile saved!");
};
window.togglePrivacyField = (k, v) => updateDoc(doc(db, "users", state.user.uid), { [k]: v, updatedAt: serverTimestamp() });
window.exportUserJson = () => {
  const blob = new Blob([JSON.stringify({ profile: state.profile, settings: state.settings, conversations: state.conversations }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `kigo-export-${state.profile.kigoId}.json`;
  a.click();
};
window.deleteFullAccount = async () => {
  if (!confirm("Permanently delete your KIGO account?")) return;
  const uid = state.user.uid;
  await deleteDoc(doc(db, "usernames", state.profile.username));
  await deleteDoc(doc(db, "users", uid, "private", "account"));
  await deleteDoc(doc(db, "users", uid));
  await deleteUser(auth.currentUser);
  toast("Account deleted.");
};
window.submitSupport = async () => {
  const reason = document.getElementById("repTopic").value;
  const details = document.getElementById("repDetails").value.trim();
  if (!details) return;
  await addDoc(collection(db, "reports"), {
    reporterId: state.user.uid, reportedUserId: state.user.uid, reason, details, status: "open", createdAt: serverTimestamp()
  });
  toast("Support report submitted.");
};

// Boot Auth listener
applyTheme(state.settings);
if (state.firebaseReady) {
  onAuthStateChanged(auth, (u) => {
    state.checkingSession = false;
    state.user = u;
    if (u) attachUserStreams(u.uid);
    else { clearSubscriptions(); state.profile = null; state.profileLoaded = false; }
    render();
  });
} else {
  state.checkingSession = false;
  render();
}
</script>
</body>
</html>
