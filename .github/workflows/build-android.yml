name: Build KIGO CHAT Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Export debug signing certificate fingerprints
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" > app/build/outputs/apk/debug/firebase-debug-certificate.txt
          grep -E 'certificate SHA-1 digest|certificate SHA-256 digest' app/build/outputs/apk/debug/firebase-debug-certificate.txt

      - name: Upload APK and Firebase fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: KIGO-CHAT-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/firebase-debug-certificate.txt
          if-no-files-found: error
