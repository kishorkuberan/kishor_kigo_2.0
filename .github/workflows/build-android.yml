name: Build KIGO CHAT Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Export debug signing certificate fingerprints
        shell: bash
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey \
            > app/build/outputs/apk/debug/firebase-debug-certificate.txt
          grep -E 'SHA1:|SHA256:' app/build/outputs/apk/debug/firebase-debug-certificate.txt

      - name: Upload APK and Firebase fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: KIGO-CHAT-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/firebase-debug-certificate.txt
          if-no-files-found: error
